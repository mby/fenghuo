name: Feature request / 功能建议
description: Suggest an improvement. 提出改进建议。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Fenghuo is deliberately minimal. Features that let the server control agents
        (remote commands, terminals, file access, auto-update) will not be added.
        烽火刻意保持极简，任何让服务端控制 Agent 的功能（远程命令、终端、文件、自动更新）都不会加入。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and why is it hard today? 你想做什么，现在为什么做不到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
